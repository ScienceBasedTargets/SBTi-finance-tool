[tool.poetry]
name = "sbti-finance-tool"
version = "1.3.0"
description = "This package implements V1 of the CDP/WWF Temperature Rating Methodology and calculates portfolio coverage for SBTi near-term targets. The portfolio coverage notebook can also be used for climate alignment assessment under the FINZ Standard."
authors = ["sbti <financialinstitutions@sciencebasedtargets.org>"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
]
keywords = ['Climate', 'SBTi', 'Finance']
packages = [{ include = "SBTi" }]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/ScienceBasedTargets/SBTi-finance-tool/issues"
"Documentation" = 'https://sciencebasedtargets.github.io/SBTi-finance-tool'
"Source Code" = "https://github.com/ScienceBasedTargets/SBTi-finance-tool"


[tool.poetry.dependencies]
python = ">=3.10,<4"
pydantic = ">=2.0.0,<3.0.0"
numpy = ">=1.21.0,<3.0.0"
pandas = ">=1.5.3,<4.0.0"
xlrd = ">=2.0.0"
requests = ">=2.0.0"
openpyxl = ">=3.1.2,<4.0.0"


[tool.poetry.group.dev.dependencies]
black = ">=26.3.1,<27"
pylint = ">=3.0.0,<5.0.0"
ipykernel = ">=7.0.0,<8"
Sphinx = ">=7.0.0,<9.0.0"
sphinx-autoapi = ">=3.0.0,<4.0.0"
sphinx-rtd-theme = ">=2.0.0,<4.0.0"

[tool.pyright]
venv = ".venv"

[project]
name = "sbti-finance-tool"
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
